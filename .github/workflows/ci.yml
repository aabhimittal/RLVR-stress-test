name: ci

on:
  push:
    branches: [main]
  pull_request:

# A branch push that also has an open PR would otherwise run every job twice,
# once per event. Restricting push to main leaves branch validation to the
# pull_request event, and the concurrency group cancels superseded runs when
# commits land faster than CI finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Self-validation against known hacks
        # Non-zero exit means a fixture came back with the wrong verdict.
        run: python -m cheater benchmark --quiet
